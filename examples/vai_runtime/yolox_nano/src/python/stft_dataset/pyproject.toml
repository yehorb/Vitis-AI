[project]
name = "stft_dataset"
version = "0.1.0"
dependencies = [
  "h5py >= 3.11.0",
  "torch >= 1.13.1",
]
requires-python = ">= 3.8"
authors = [
  {name = "Yehor Borkov"},
]
description = "A simple torch.utils.data.Dataset, that loads stft data generated by the generate_training_signal.m script"
license = {file = "LICENSE"}

[project.optional-dependencies]
vis = [
  "matplotlib >= 3.7.3",
]

[build-system]
requires = ["setuptools >= 75.3.2"]
build-backend = "setuptools.build_meta"
